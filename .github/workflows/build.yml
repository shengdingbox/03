name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（x.y.z，如 2.1.3；留空则使用 VERSION 文件内容）'
        required: false
        default: ''
      publish:
        description: '显式发布 GitHub Release（测试构建请保持 false）'
        required: true
        type: boolean
        default: false
      build_windows:
        description: '构建 Windows'
        required: true
        type: boolean
        default: true
      build_macos:
        description: '构建 macOS'
        required: true
        type: boolean
        default: true
      build_linux:
        description: '构建 Linux CLI'
        required: true
        type: boolean
        default: true

jobs:
  build:
    # Go 交叉编译：单矩阵在 Linux runner 上产出三平台产物
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, name: BuddyTool,  ext: .exe,  pkg: zip,      artifact: windows-build }
          - { goos: darwin,  goarch: amd64, name: BuddyTool,  ext: '',    pkg: zip,      artifact: macos-intel-build }
          - { goos: darwin,  goarch: arm64, name: BuddyTool,  ext: '',    pkg: zip,      artifact: macos-arm-build }
          - { goos: linux,   goarch: amd64, name: buddy-tool, ext: '',    pkg: tar.gz,   artifact: linux-cli-build }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          SOURCE_VER=$(tr -d '\r\n' < VERSION)
          VER="${INPUT_VER:-$SOURCE_VER}"
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VER"; exit 1; }
          echo "Building version $VER"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w -X buddy.tool/cli/internal/version.injectedVersion=$VER" \
            -o out/${{ matrix.name }}${{ matrix.ext }} .
          ls -lh out/

      - name: Package
        run: |
          cd out
          if [ "${{ matrix.pkg }}" = "zip" ]; then
            zip -r ${{ matrix.name }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip ${{ matrix.name }}${{ matrix.ext }}
          else
            tar -czf ${{ matrix.name }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ${{ matrix.name }}${{ matrix.ext }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            out/${{ matrix.name }}-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.pkg }}

  release:
    # Tag push alone never publishes. Manual dispatch must explicitly set publish=true.
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish == true }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          SOURCE_VERSION=$(tr -d '\r\n' < VERSION)
          VERSION="${{ github.event.inputs.version }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$SOURCE_VERSION"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Buddy Tool v${{ steps.version.outputs.version }}
          body: |
            ## Buddy Tool v${{ steps.version.outputs.version }}

            Go 编译的单二进制 CLI，零依赖，跨平台。

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | Windows x64 | BuddyTool-windows-amd64.zip |
            | macOS Intel | BuddyTool-darwin-amd64.zip |
            | macOS ARM (M1/M2/M3) | BuddyTool-darwin-arm64.zip |
            | Linux amd64 | buddy-tool-linux-amd64.tar.gz |

            ### 安装与使用（命令行）

            **Windows**: 解压 `BuddyTool-windows-amd64.zip`，在 CMD 或 PowerShell 中运行：
            ```
            BuddyTool.exe help               # 查看帮助
            BuddyTool.exe info               # 展示当前信息
            BuddyTool.exe credits            # 查询积分
            BuddyTool.exe config-workbuddy   # 配置 WorkBuddy models.json
            BuddyTool.exe restore-config workbuddy  # 还原 WorkBuddy 配置
            ```

            **macOS**: 解压对应架构的 zip，执行：
            ```
            chmod +x BuddyTool
            ./BuddyTool help               # 查看帮助
            ./BuddyTool info               # 展示当前信息
            ```

            **Linux**:
            ```
            tar -xzf buddy-tool-linux-amd64.tar.gz
            chmod +x buddy-tool
            ./buddy-tool help              # 查看帮助
            ./buddy-tool info              # 展示当前信息
            ./buddy-tool credits           # 查询积分
            ./buddy-tool config            # 展示配置
            ./buddy-tool config-workbuddy  # 配置 WorkBuddy models.json
            ```

            ### 版本号
            ${{ steps.version.outputs.version }}
          files: |
            artifacts/windows-build/BuddyTool-windows-amd64.zip
            artifacts/macos-intel-build/BuddyTool-darwin-amd64.zip
            artifacts/macos-arm-build/BuddyTool-darwin-arm64.zip
            artifacts/linux-cli-build/buddy-tool-linux-amd64.tar.gz
          draft: false
          prerelease: false
